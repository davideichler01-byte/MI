<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול הכנסות והוצאות - דוידי</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .hidden-section { display: none; }
    </style>
</head>
<body class="bg-gray-100 p-4 font-sans pb-12">

    <div class="max-w-md mx-auto space-y-4">
        
        <!-- מאזן חודשי -->
        <div class="bg-white p-6 rounded-2xl shadow-sm text-center">
            <h1 class="text-gray-500 mb-1 text-sm font-medium">מאזן חודשי</h1>
            <div class="text-3xl font-bold text-green-600 mb-4">+3,238 ₪</div>
            
            <div class="flex gap-4">
                <div onclick="toggleSection('expenses')" class="flex-1 bg-pink-50 p-4 rounded-xl cursor-pointer hover:bg-pink-100 transition">
                    <p class="text-pink-600 text-sm">הוצאות</p>
                    <p class="font-bold text-xl text-pink-700">13,838 ₪</p>
                </div>
                <div onclick="toggleSection('income')" class="flex-1 bg-green-50 p-4 rounded-xl cursor-pointer hover:bg-green-100 transition">
                    <p class="text-green-600 text-sm">הכנסות</p>
                    <p class="font-bold text-xl text-green-700">17,076 ₪</p>
                </div>
            </div>
        </div>

        <!-- אזור הפירוט (נסתר כברירת מחדל) -->
        <div id="details-section" class="bg-white p-6 rounded-2xl shadow-sm hidden-section">
            <div class="flex justify-between items-center mb-4">
                <h2 id="section-title" class="text-lg font-bold text-gray-800">פירוט</h2>
                <button onclick="hideSection()" class="text-gray-400 hover:text-gray-600 font-bold">סגור X</button>
            </div>
            <ul id="details-list" class="space-y-2 text-sm divide-y divide-gray-100 max-h-60 overflow-y-auto"></ul>
        </div>

        <!-- תרשים -->
        <div class="bg-white p-6 rounded-2xl shadow-sm">
            <h2 class="text-center font-bold text-gray-700 mb-4">התפלגות הוצאות</h2>
            <div class="relative w-48 h-48 mx-auto"><canvas id="expenseChart"></canvas></div>
        </div>

        <!-- טופס הוספה -->
        <div class="bg-white p-6 rounded-2xl shadow-sm">
            <h2 class="font-bold text-gray-800 mb-4">הוספת תנועה חדשה</h2>
            <form onsubmit="alert('התנועה נוספה!'); return false;" class="space-y-3">
                <input type="text" placeholder="תיאור" required class="w-full border rounded-xl p-2.5 text-sm">
                <input type="number" placeholder="סכום" required class="w-full border rounded-xl p-2.5 text-sm">
                <select class="w-full border rounded-xl p-2.5 text-sm">
                    <option>דיור</option><option>רכב ודלק</option><option>ביטוחים</option><option>אחר</option>
                </select>
                <button class="w-full bg-gray-900 text-white py-3 rounded-xl font-bold">הוסף</button>
            </form>
        </div>
    </div>

    <script>
        const expensesData = [
            { name: "שכ\"ד/משכנתא", amount: "6,353 ₪" },
            { name: "חשמל", amount: "120 ₪" },
            { name: "דלק", amount: "1,000 ₪" },
            { name: "גן", amount: "1,500 ₪" }
        ];
        const incomeData = [
            { name: "משכורת צבא", amount: "8,300 ₪" },
            { name: "משכורת גולדי", amount: "5,000 ₪" }
        ];

        function toggleSection(type) {
            const section = document.getElementById('details-section');
            const list = document.getElementById('details-list');
            const title = document.getElementById('section-title');
            
            list.innerHTML = '';
            if (type === 'expenses') {
                title.innerText = "פירוט הוצאות";
                expensesData.forEach(i => list.innerHTML += `<li class="flex justify-between py-2 text-pink-600"><span>${i.name}</span><span>${i.amount}</span></li>`);
            } else {
                title.innerText = "פירוט הכנסות";
                incomeData.forEach(i => list.innerHTML += `<li class="flex justify-between py-2 text-green-600"><span>${i.name}</span><span>${i.amount}</span></li>`);
            }
            section.style.display = 'block';
        }

        function hideSection() { document.getElementById('details-section').style.display = 'none'; }

        new Chart(document.getElementById('expenseChart').getContext('2d'), {
            type: 'doughnut',
            data: { labels: ['שכ"ד', 'רכב', 'אחר'], datasets: [{ data: [6353, 2010, 5475], backgroundColor: ['#f43f5e', '#fb7185', '#fda4af'] }] },
            options: { responsive: true, maintainAspectRatio: false }
        });
    </script>
</body>
</html>
