<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול הכנסות והוצאות - דוידי</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .hidden-section { display: none; }
    </style>
</head>
<body class="bg-gray-100 p-4 font-sans pb-12">

    <div class="max-w-md mx-auto space-y-4">
        
        <!-- מאזן חודשי -->
        <div class="bg-white p-6 rounded-2xl shadow-sm text-center">
            <h1 class="text-gray-500 mb-1 text-sm font-medium">מאזן חודשי</h1>
            <div id="net-balance" class="text-3xl font-bold text-green-600 mb-4">+3,238 ₪</div>
            
            <div class="flex gap-4">
                <div onclick="toggleSection('expenses')" class="flex-1 bg-pink-50 p-4 rounded-xl cursor-pointer hover:bg-pink-100 transition">
                    <p class="text-pink-600 text-sm">הוצאות</p>
                    <p id="total-expenses" class="font-bold text-xl text-pink-700">13,838 ₪</p>
                </div>
                <div onclick="toggleSection('income')" class="flex-1 bg-green-50 p-4 rounded-xl cursor-pointer hover:bg-green-100 transition">
                    <p class="text-green-600 text-sm">הכנסות</p>
                    <p id="total-income" class="font-bold text-xl text-green-700">17,076 ₪</p>
                </div>
            </div>
        </div>

        <!-- אזור הפירוט (נסתר כברירת מחדל) -->
        <div id="details-section" class="bg-white p-6 rounded-2xl shadow-sm hidden-section">
            <div class="flex justify-between items-center mb-4">
                <h2 id="section-title" class="text-lg font-bold text-gray-800">פירוט</h2>
                <button onclick="hideSection()" class="text-gray-400 hover:text-gray-600 font-bold">סגור X</button>
            </div>
            <ul id="details-list" class="space-y-2 text-sm divide-y divide-gray-100 max-h-60 overflow-y-auto"></ul>
        </div>

        <!-- תרשים -->
        <div class="bg-white p-6 rounded-2xl shadow-sm">
            <h2 class="text-center font-bold text-gray-700 mb-4">התפלגות הוצאות</h2>
            <div class="relative w-48 h-48 mx-auto"><canvas id="expenseChart"></canvas></div>
        </div>

        <!-- טופס הוספה -->
        <div class="bg-white p-6 rounded-2xl shadow-sm">
            <h2 class="font-bold text-gray-800 mb-4">הוספת תנועה חדשה</h2>
            <div class="flex gap-2 mb-4">
                <button type="button" id="type-expense" onclick="setFormType('expense')" class="flex-1 py-2 rounded-xl font-bold bg-pink-500 text-white transition">הוצאה</button>
                <button type="button" id="type-income" onclick="setFormType('income')" class="flex-1 py-2 rounded-xl font-bold bg-gray-100 text-gray-600 transition">הכנסה</button>
            </div>
            <form onsubmit="addTransaction(event)" class="space-y-3">
                <div>
                    <label class="block text-xs text-gray-500 mb-1">תיאור</label>
                    <input type="text" id="tx-desc" placeholder="לדוגמה: סופרמרקט" required class="w-full border border-gray-200 rounded-xl p-2.5 text-sm outline-none focus:border-blue-500">
                </div>
                <div class="flex gap-2">
                    <div class="flex-1">
                        <label class="block text-xs text-gray-500 mb-1">סכום (₪)</label>
                        <input type="number" id="tx-amount" placeholder="0" required class="w-full border border-gray-200 rounded-xl p-2.5 text-sm outline-none focus:border-blue-500">
                    </div>
                    <div class="flex-1">
                        <label class="block text-xs text-gray-500 mb-1">קטגוריה</label>
                        <select id="tx-category" class="w-full border border-gray-200 rounded-xl p-2.5 text-sm outline-none focus:border-blue-500 bg-white">
                            <option value="דיור">דיור</option>
                            <option value="רכב ודלק">רכב ודלק</option>
                            <option value="ביטוחים">ביטוחים</option>
                            <option value="ילדים וחינוך">ילדים וחינוך</option>
                            <option value="צדקה">צדקה</option>
                            <option value="הכנסות עבודה">הכנסות עבודה</option>
                            <option value="אחר">אחר</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="w-full bg-gray-900 text-white py-3 rounded-xl font-bold text-sm hover:bg-gray-800 transition">הוסף תנועה</button>
            </form>
        </div>
    </div>

    <script>
        let currentFormType = 'expense';

        function setFormType(type) {
            currentFormType = type;
            const expBtn = document.getElementById('type-expense');
            const incBtn = document.getElementById('type-income');
            if (type === 'expense') {
                expBtn.className = "flex-1 py-2 rounded-xl font-bold bg-pink-500 text-white transition";
                incBtn.className = "flex-1 py-2 rounded-xl font-bold bg-gray-100 text-gray-600 transition";
            } else {
                incBtn.className = "flex-1 py-2 rounded-xl font-bold bg-green-500 text-white transition";
                expBtn.className = "flex-1 py-2 rounded-xl font-bold bg-gray-100 text-gray-600 transition";
            }
        }

        let expensesData = [
            { name: "שכ\"ד/משכנתא", rawAmount: 6353, amount: "6,353.00 ₪" },
            { name: "חשמל", rawAmount: 120, amount: "120.00 ₪" },
            { name: "גז", rawAmount: 50, amount: "50.00 ₪" },
            { name: "תשלומי רכב", rawAmount: 760, amount: "760.00 ₪" },
            { name: "הוצאות רכב בליי", rawAmount: 250, amount: "250.00 ₪" },
            { name: "הלוואות מזרחי דירה", rawAmount: 600, amount: "600.00 ₪" },
            { name: "צדקה אהבת חסד", rawAmount: 100, amount: "100.00 ₪" },
            { name: "צדקה בית כנסת", rawAmount: 150, amount: "150.00 ₪" },
            { name: "ביטוח רכב", rawAmount: 350, amount: "350.00 ₪" },
            { name: "ביטוחים", rawAmount: 300, amount: "300.00 ₪" },
            { name: "ועד בית", rawAmount: 245, amount: "245.00 ₪" },
            { name: "חוג לפערי", rawAmount: 180, amount: "180.00 ₪" },
            { name: "טלפון ותקשורת", rawAmount: 180, amount: "180.00 ₪" },
            { name: "דלק", rawAmount: 1000, amount: "1,000.00 ₪" },
            { name: "ארמונה בהנחה", rawAmount: 200, amount: "200.00 ₪" },
            { name: "מים", rawAmount: 150, amount: "150.00 ₪" },
            { name: "גן", rawAmount: 1500, amount: "1,500.00 ₪" },
            { name: "חסכונות ילדים", rawAmount: 600, amount: "600.00 ₪" },
            { name: "הנהלת חשבונות", rawAmount: 180, amount: "180.00 ₪" }
        ];

        let incomeData = [
            { name: "משכורת צבא", rawAmount: 8300, amount: "8,300.00 ₪" },
            { name: "עצמאי", rawAmount: 2000, amount: "2,000.00 ₪" },
            { name: "משכורת גולדי", rawAmount: 5000, amount: "5,000.00 ₪" },
            { name: "בונוס ניהול חנות", rawAmount: 1500, amount: "1,500.00 ₪" },
            { name: "ביטוח לאומי", rawAmount: 276, amount: "276.00 ₪" }
        ];

        let activeSectionType = null;

        function updateTotals() {
            let totalExp = expensesData.reduce((sum, item) => sum + item.rawAmount, 0);
            let totalInc = incomeData.reduce((sum, item) => sum + item.rawAmount, 0);
            let net = totalInc - totalExp;

            document.getElementById('total-expenses').innerText = totalExp.toLocaleString() + " ₪";
            document.getElementById('total-income').innerText = totalInc.toLocaleString() + " ₪";
            
            const netEl = document.getElementById('net-balance');
            netEl.innerText = (net >= 0 ? "+" : "") + net.toLocaleString() + " ₪";
            netEl.className = `text-3xl font-bold mb-4 ${net >= 0 ? 'text-green-600' : 'text-pink-600'}`;

            if (activeSectionType) {
                toggleSection(activeSectionType, true);
            }
        }

        function toggleSection(type, keepOpen = false) {
            const section = document.getElementById('details-section');
            const list = document.getElementById('details-list');
            const title = document.getElementById('section-title');
            
            if (!keepOpen && activeSectionType === type && section.style.display === 'block') {
                hideSection();
                return;
            }

            activeSectionType = type;
            list.innerHTML = '';
            
            if (type === 'expenses') {
                title.innerText = "פירוט הוצאות";
                expensesData.forEach(i => list.innerHTML += `<li class="flex justify-between py-2 text-pink-600"><span>${i.name}</span><span class="font-semibold">${i.amount}</span></li>`);
            } else {
                title.innerText = "פירוט הכנסות";
                incomeData.forEach(i => list.innerHTML += `<li class="flex justify-between py-2 text-green-600"><span>${i.name}</span><span class="font-semibold">${i.amount}</span></li>`);
            }
            section.style.display = 'block';
        }

        function hideSection() { 
            document.getElementById('details-section').style.display = 'none'; 
            activeSectionType = null;
        }

        function addTransaction(e) {
            e.preventDefault();
            const desc = document.getElementById('tx-desc').value;
            const amountVal = parseFloat(document.getElementById('tx-amount').value);
            const category = document.getElementById('tx-category').value;
            
            const formattedAmount = amountVal.toLocaleString() + ".00 ₪";
            const fullName = `${desc} (${category})`;

            if (currentFormType === 'expense') {
                expensesData.push({ name: fullName, rawAmount: amountVal, amount: formattedAmount });
            } else {
                incomeData.push({ name: fullName, rawAmount: amountVal, amount: formattedAmount });
            }

            updateTotals();
            alert("התנועה נוספה בהצלחה!");
            document.getElementById('tx-desc').value = '';
            document.getElementById('tx-amount').value = '';
        }

        updateTotals();

        const ctx = document.getElementById('expenseChart').getContext('2d');
        new Chart(ctx, {
            type: 'doughnut',
            data: { 
                labels: ['שכ"ד', 'רכב ודלק', 'גן', 'אחר'], 
                datasets: [{ 
                    data: [6353, 2010, 1500, 3975], 
                    backgroundColor: ['#f43f5e', '#fb7185', '#fda4af', '#fecdd3'] 
                }] 
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
        });
    </script>
</body>
</html>
