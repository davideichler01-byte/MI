<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- תגיות למניעת שמירת גירסה ישנה בזיכרון המטמון -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>תקציב אישי</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap');
        body { font-family: 'Assistant', sans-serif; background-color: #f4f6f9; }
    </style>
</head>
<body class="p-4 md:p-8 max-w-2xl mx-auto">

    <!-- כותרת ובחירת חודש -->
    <div class="flex justify-between items-center mb-6 bg-white p-4 rounded-xl shadow-sm">
        <button onclick="changeMonth(-1)" class="text-indigo-600 hover:bg-indigo-50 p-2 rounded-lg font-bold text-lg">&gt;</button>
        <h1 id="currentMonthYear" class="text-xl font-bold text-gray-800"></h1>
        <button onclick="changeMonth(1)" class="text-indigo-600 hover:bg-indigo-50 p-2 rounded-lg font-bold text-lg">&lt;</button>
    </div>

    <!-- כרטיסיית סיכום ומאזן -->
    <div class="bg-white p-6 rounded-2xl shadow-sm mb-6 border border-gray-100">
        <div class="text-center mb-4">
            <span class="text-gray-500 text-sm font-semibold">מאזן חודשי</span>
            <div id="totalBalance" class="text-3xl font-extrabold text-gray-800 mt-1">0 ₪</div>
        </div>
        <div class="grid grid-cols-2 gap-4 pt-4 border-t border-gray-100">
            <div class="bg-emerald-50 p-3 rounded-xl text-center">
                <span class="text-emerald-600 text-xs font-bold block">הכנסות</span>
                <span id="totalIncome" class="text-emerald-700 font-bold text-lg">0 ₪</span>
            </div>
            <div class="bg-rose-50 p-3 rounded-xl text-center">
                <span class="text-rose-600 text-xs font-bold block">הוצאות</span>
                <span id="totalExpense" class="text-rose-700 font-bold text-lg">0 ₪</span>
            </div>
        </div>
    </div>

    <!-- גרף התפלגות הוצאות -->
    <div class="bg-white p-6 rounded-2xl shadow-sm mb-6 border border-gray-100">
        <h2 class="text-lg font-bold text-gray-800 mb-4 text-center">התפלגות הוצאות</h2>
        <div class="w-48 h-48 mx-auto">
            <canvas id="expenseChart"></canvas>
        </div>
    </div>

    <!-- טופס הוספת תנועה -->
    <div class="bg-white p-6 rounded-2xl shadow-sm mb-6 border border-gray-100">
        <h2 class="text-lg font-bold text-gray-800 mb-4">הוספת תנועה</h2>
        <form id="transactionForm" onsubmit="addTransaction(event)" class="space-y-4">
            <div class="grid grid-cols-2 gap-2 p-1 bg-gray-100 rounded-xl">
                <button type="button" id="btnExpense" onclick="setType('expense')" class="py-2 rounded-lg font-bold text-sm bg-rose-500 text-white shadow-sm transition">הוצאה</button>
                <button type="button" id="btnIncome" onclick="setType('income')" class="py-2 rounded-lg font-bold text-sm text-gray-600 transition">הכנסה</button>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-500 mb-1">תיאור</label>
                <input type="text" id="descInput" required placeholder="לדוגמה: סופרמרקט" class="w-full p-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">סכום (₪)</label>
                    <input type="number" step="any" id="amountInput" required placeholder="0" class="w-full p-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">קטגוריה</label>
                    <select id="categoryInput" class="w-full p-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                        <option value="כללי">כללי</option>
                        <option value="מזון וקניות">מזון וקניות</option>
                        <option value="חשבונות ודיור">חשבונות ודיור</option>
                        <option value="תחבורה">תחבורה</option>
                        <option value="פנאי ובילויים">פנאי ובילויים</option>
                        <option value="משכורת">משכורת</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="w-full bg-indigo-600 text-white font-bold p-3 rounded-xl hover:bg-indigo-700 transition">הוסף תנועה</button>
        </form>
    </div>

    <!-- רשימת תנועות מתקפלת -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden mb-8">
        <button onclick="toggleList()" class="w-full p-4 flex justify-between items-center bg-white hover:bg-gray-50 transition">
            <span class="font-bold text-gray-800">פירוט תנועות החודש</span>
            <i id="listChevron" class="fa-solid fa-chevron-down text-gray-400 transition-transform duration-300"></i>
        </button>
        <div id="transactionsListContainer" class="hidden border-t border-gray-100 p-4">
            <div id="transactionsList" class="space-y-3"></div>
        </div>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDL-TvU-NDdt_mIR0R0nG85IeA2q7tHID0",
            authDomain: "mi-budget-5dd37.firebaseapp.com",
            projectId: "mi-budget-5dd37",
            storageBucket: "mi-budget-5dd37.firebasestorage.app",
            messagingSenderId: "740618672548",
            appId: "1:740618672548:web:3d5c91490d0e9525c00931",
            measurementId: "G-JH6GCNNFRW"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentType = 'expense';
        let currentDate = new Date();
        let myChart = null;

        function setType(type) {
            currentType = type;
            const btnExpense = document.getElementById('btnExpense');
            const btnIncome = document.getElementById('btnIncome');
            if (type === 'expense') {
                btnExpense.className = "py-2 rounded-lg font-bold text-sm bg-rose-500 text-white shadow-sm transition";
                btnIncome.className = "py-2 rounded-lg font-bold text-sm text-gray-600 transition";
            } else {
                btnIncome.className = "py-2 rounded-lg font-bold text-sm bg-emerald-500 text-white shadow-sm transition";
                btnExpense.className = "py-2 rounded-lg font-bold text-sm text-gray-600 transition";
            }
        }

        function toggleList() {
            const container = document.getElementById('transactionsListContainer');
            const chevron = document.getElementById('listChevron');
            container.classList.toggle('hidden');
            chevron.classList.toggle('rotate-180');
        }

        function changeMonth(delta) {
            currentDate.setMonth(currentDate.getMonth() + delta);
            loadData();
        }

        function addTransaction(e) {
            e.preventDefault();
            const desc = document.getElementById('descInput').value;
            const amount = parseFloat(document.getElementById('amountInput').value);
            const category = document.getElementById('categoryInput').value;

            db.collection('transactions').add({
                desc,
                amount,
                category,
                type: currentType,
                date: firebase.firestore.Timestamp.fromDate(new Date(currentDate.getFullYear(), currentDate.getMonth(), new Date().getDate()))
            }).then(() => {
                document.getElementById('transactionForm').reset();
                setType('expense');
            });
        }

        function deleteTransaction(id) {
            db.collection('transactions').doc(id).delete();
        }

        function loadData() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            const monthNames = ["ינואר", "פברואר", "מרץ", "אפריל", "מאי", "יוני", "יולי", "אוגוסט", "ספטמבר", "אוקטובר", "נובמבר", "דצמבר"];
            document.getElementById('currentMonthYear').innerText = `${monthNames[month]} ${year}`;

            const startOfMonth = new Date(year, month, 1);
            const endOfMonth = new Date(year, month + 1, 0, 23, 59, 59);

            db.collection('transactions')
                .where('date', '>=', firebase.firestore.Timestamp.fromDate(startOfMonth))
                .where('date', '<=', firebase.firestore.Timestamp.fromDate(endOfMonth))
                .onSnapshot(snapshot => {
                    let income = 0;
                    let expense = 0;
                    const listEl = document.getElementById('transactionsList');
                    listEl.innerHTML = '';
                    const categoryTotals = {};

                    if (snapshot.empty) {
                        listEl.innerHTML = '<div class="text-center text-gray-400 py-4 text-sm">אין תנועות בחודש זה</div>';
                    }

                    snapshot.forEach(doc => {
                        const data = doc.data();
                        const id = doc.id;

                        if (data.type === 'income') {
                            income += data.amount;
                        } else {
                            expense += data.amount;
                            categoryTotals[data.category] = (categoryTotals[data.category] || 0) + data.amount;
                        }

                        const item = document.createElement('div');
                        item.className = "flex justify-between items-center p-3 bg-gray-50 rounded-xl hover:bg-gray-100 transition";
                        item.innerHTML = `
                            <div class="flex items-center space-x-3 space-x-reverse">
                                <div class="w-8 h-8 rounded-full flex items-center justify-center ${data.type === 'income' ? 'bg-emerald-100 text-emerald-600' : 'bg-rose-100 text-rose-600'}">
                                    <i class="fa-solid ${data.type === 'income' ? 'fa-arrow-down' : 'fa-arrow-up'} text-xs"></i>
                                </div>
                                <div>
                                    <div class="font-bold text-gray-800 text-sm">${data.desc}</div>
                                    <div class="text-xs text-gray-400">${data.category}</div>
                                </div>
                            </div>
                            <div class="flex items-center space-x-3 space-x-reverse">
                                <span class="font-bold ${data.type === 'income' ? 'text-emerald-600' : 'text-rose-600'} text-sm">
                                    ${data.type === 'income' ? '+' : '-'}${data.amount} ₪
                                </span>
                                <button onclick="deleteTransaction('${id}')" class="text-gray-300 hover:text-rose-500 text-xs">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                        `;
                        listEl.appendChild(item);
                    });

                    document.getElementById('totalIncome').innerText = `${income} ₪`;
                    document.getElementById('totalExpense').innerText = `${expense} ₪`;
                    document.getElementById('totalBalance').innerText = `${income - expense} ₪`;

                    updateChart(categoryTotals);
                });
        }

        function updateChart(categoryTotals) {
            const ctx = document.getElementById('expenseChart').getContext('2d');
            const labels = Object.keys(categoryTotals);
            const data = Object.values(categoryTotals);

            if (myChart) {
                myChart.destroy();
            }

            if (data.length === 0) {
                myChart = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['אין הוצאות'],
                        datasets: [{
                            data: [1],
                            backgroundColor: ['#e5e7eb']
                        }]
                    },
                    options: { plugins: { legend: { display: false } }, responsive: true, maintainAspectRatio: false }
                });
                return;
            }

            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: [
                            '#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899'
                        ]
                    }]
                },
                options: {
                    plugins: {
                        legend: { position: 'bottom', labels: { font: { family: 'Assistant' } } }
                    },
                    responsive: true,
                    maintainAspectRatio: false
                }
            });
        }

        loadData();
    </script>
</body>
</html>
