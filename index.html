<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול הכנסות והוצאות - דוידי</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 p-4 font-sans pb-12">

    <div class="max-w-md mx-auto space-y-4">
        
        <!-- מאזן חודשי -->
        <div class="bg-white p-6 rounded-2xl shadow-sm text-center">
            <h1 class="text-gray-500 mb-1 text-sm font-medium">מאזן חודשי</h1>
            <div id="net-balance" class="text-3xl font-bold text-green-600 mb-4">+3,238 ₪</div>
            
            <div class="flex gap-4">
                <div onclick="switchTab('expenses')" class="flex-1 bg-pink-50 p-4 rounded-xl cursor-pointer hover:bg-pink-100 transition">
                    <p class="text-pink-600 text-sm">הוצאות חודשיות</p>
                    <p class="font-bold text-xl text-pink-700">13,838 ₪</p>
                </div>
                <div onclick="switchTab('income')" class="flex-1 bg-green-50 p-4 rounded-xl cursor-pointer hover:bg-green-100 transition">
                    <p class="text-green-600 text-sm">הכנסות חודשיות</p>
                    <p class="font-bold text-xl text-green-700">17,076 ₪</p>
                </div>
            </div>
        </div>

        <!-- תרשים התפלגות הוצאות -->
        <div class="bg-white p-6 rounded-2xl shadow-sm">
            <h2 class="text-center font-bold text-gray-700 mb-4">התפלגות הוצאות</h2>
            <div class="relative w-48 h-48 mx-auto">
                <canvas id="expenseChart"></canvas>
            </div>
        </div>

        <!-- קבועות (תשלומים חודשיים) -->
        <div class="bg-white p-6 rounded-2xl shadow-sm">
            <h2 class="font-bold text-gray-800 mb-3">קבועות (תשלומים חודשיים)</h2>
            <div id="fixed-list" class="space-y-2 text-sm text-gray-700 max-h-48 overflow-y-auto divide-y divide-gray-50"></div>
        </div>

        <!-- טופס הוספת תנועה חד פעמית -->
        <div class="bg-white p-6 rounded-2xl shadow-sm">
            <h2 class="font-bold text-gray-800 mb-4">הוספת תנועה חד פעמית</h2>
            <div class="flex gap-2 mb-4">
                <button type="button" id="type-expense" onclick="setFormType('expense')" class="flex-1 py-2 rounded-xl font-bold bg-pink-500 text-white transition">הוצאה</button>
                <button type="button" id="type-income" onclick="setFormType('income')" class="flex-1 py-2 rounded-xl font-bold bg-gray-100 text-gray-600 transition">הכנסה</button>
            </div>
            <form onsubmit="addTransaction(event)" class="space-y-3">
                <div>
                    <label class="block text-xs text-gray-500 mb-1">תיאור</label>
                    <input type="text" id="tx-desc" placeholder="לדוגמה: סופרמרקט" required class="w-full border border-gray-200 rounded-xl p-2.5 text-sm outline-none focus:border-blue-500">
                </div>
                <div class="flex gap-2">
                    <div class="flex-1">
                        <label class="block text-xs text-gray-500 mb-1">סכום (₪)</label>
                        <input type="number" id="tx-amount" placeholder="0" required class="w-full border border-gray-200 rounded-xl p-2.5 text-sm outline-none focus:border-blue-500">
                    </div>
                    <div class="flex-1">
                        <label class="block text-xs text-gray-500 mb-1">קטגוריה</label>
                        <input type="text" id="tx-category" placeholder="כללי" class="w-full border border-gray-200 rounded-xl p-2.5 text-sm outline-none focus:border-blue-500">
                    </div>
                </div>
                <button type="submit" class="w-full bg-gray-900 text-white py-3 rounded-xl font-bold text-sm hover:bg-gray-800 transition">הוסף תנועה</button>
            </form>
        </div>

        <!-- פירוט נפתח בלחיצה -->
        <div id="details-view" class="bg-white p-6 rounded-2xl shadow-sm hidden">
            <div class="flex justify-between items-center mb-4">
                <h2 id="view-title" class="text-lg font-bold text-gray-800">פירוט</h2>
                <button onclick="closeDetails()" class="text-gray-400 hover:text-gray-600 text-sm font-bold">סגור X</button>
            </div>
            <ul id="details-list" class="space-y-2 text-sm divide-y divide-gray-100 max-h-60 overflow-y-auto"></ul>
        </div>

    </div>

    <script>
        let currentFormType = 'expense';

        function setFormType(type) {
            currentFormType = type;
            const expBtn = document.getElementById('type-expense');
            const incBtn = document.getElementById('type-income');
            if (type === 'expense') {
                expBtn.className = "flex-1 py-2 rounded-xl font-bold bg-pink-500 text-white transition";
                incBtn.className = "flex-1 py-2 rounded-xl font-bold bg-gray-100 text-gray-600 transition";
            } else {
                incBtn.className = "flex-1 py-2 rounded-xl font-bold bg-green-500 text-white transition";
                expBtn.className = "flex-1 py-2 rounded-xl font-bold bg-gray-100 text-gray-600 transition";
            }
        }

        const expensesData = [
            { name: "שכ\"ד/משכנתא", amount: "6,353.00 ₪" },
            { name: "חשמל", amount: "120.00 ₪" },
            { name: "גז", amount: "50.00 ₪" },
            { name: "תשלומי רכב", amount: "760.00 ₪" },
            { name: "הוצאות רכב בליי", amount: "250.00 ₪" },
            { name: "הלוואות מזרחי דירה", amount: "600.00 ₪" },
            { name: "צדקה אהבת חסד", amount: "100.00 ₪" },
            { name: "צדקה בית כנסת", amount: "150.00 ₪" },
            { name: "ביטוח רכב", amount: "350.00 ₪" },
            { name: "ביטוחים", amount: "300.00 ₪" },
            { name: "ועד בית", amount: "245.00 ₪" },
            { name: "חוג לפערי", amount: "180.00 ₪" },
            { name: "טלפון ותקשורת", amount: "180.00 ₪" },
            { name: "דלק", amount: "1,000.00 ₪" },
            { name: "ארמונה בהנחה", amount: "200.00 ₪" },
            { name: "מים", amount: "150.00 ₪" },
            { name: "גן", amount: "1,500.00 ₪" },
            { name: "חסכונות ילדים", amount: "600.00 ₪" },
            { name: "הנהלת חשבונות", amount: "180.00 ₪" }
        ];

        const incomeData = [
            { name: "משכורת צבא", amount: "8,300.00 ₪" },
            { name: "עצמאי", amount: "2,000.00 ₪" },
            { name: "משכורת גולדי", amount: "5,000.00 ₪" },
            { name: "בונוס ניהול חנות", amount: "1,500.00 ₪" },
            { name: "ביטוח לאומי", amount: "276.00 ₪" }
        ];

        const fixedListEl = document.getElementById('fixed-list');
        expensesData.forEach(item => {
            fixedListEl.innerHTML += `<div class="flex justify-between py-1"><span>${item.name}</span><span class="font-semibold text-pink-600">${item.amount}</span></div>`;
        });

        function switchTab(type) {
            const detailsView = document.getElementById('details-view');
            const viewTitle = document.getElementById('view-title');
            const detailsList = document.getElementById('details-list');
            
            detailsList.innerHTML = '';
            
            if (type === 'expenses') {
                viewTitle.innerText = "פירוט הוצאות חודשיות";
                expensesData.forEach(item => {
                    detailsList.innerHTML += `<li class="flex justify-between py-2"><span class="text-gray-700">${item.name}</span><span class="font-semibold text-pink-600">${item.amount}</span></li>`;
                });
            } else {
                viewTitle.innerText = "פירוט הכנסות חודשיות";
                incomeData.forEach(item => {
                    detailsList.innerHTML += `<li class="flex justify-between py-2"><span class="text-gray-700">${item.name}</span><span class="font-semibold text-green-600">${item.amount}</span></li>`;
                });
            }
            detailsView.classList.remove('hidden');
        }

        function closeDetails() {
            document.getElementById('details-view').classList.add('hidden');
        }

        function addTransaction(e) {
            e.preventDefault();
            const desc = document.getElementById('tx-desc').value;
            const amount = document.getElementById('tx-amount').value;
            
            if (currentFormType === 'expense') {
                expensesData.push({ name: desc, amount: amount + " ₪" });
            } else {
                incomeData.push({ name: desc, amount: amount + " ₪" });
            }
            alert("התנועה נוספה בהצלחה!");
            document.getElementById('tx-desc').value = '';
            document.getElementById('tx-amount').value = '';
            document.getElementById('tx-category').value = '';
        }

        const ctx = document.getElementById('expenseChart').getContext('2d');
        new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['שכ"ד', 'רכב ודלק', 'גן', 'אחר'],
                datasets: [{
                    data: [6353, 2010, 1500, 3975],
                    backgroundColor: ['#f43f5e', '#fb7185', '#fda4af', '#fecdd3']
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } }
            }
        });
    </script>
</body>
</html>
