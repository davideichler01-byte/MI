<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול הכנסות והוצאות - דוידי</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-gray-100 p-4 font-sans pb-12">

<div class="max-w-md mx-auto space-y-4">

    <!-- סטטוס Firebase -->
    <div id="firebase-status"
         class="bg-blue-50 text-blue-700 text-xs text-center rounded-xl p-2">
        מתחבר ל-Firebase...
    </div>

    <!-- מאזן חודשי -->
    <div class="bg-white p-6 rounded-2xl shadow-sm text-center">
        <h1 class="text-gray-500 mb-1 text-sm font-medium">מאזן</h1>
        <div id="net-balance" class="text-3xl font-bold text-green-600 mb-4">+0 ₪</div>

        <div class="flex gap-4">
            <div onclick="toggleSection('expenses')"
                 class="flex-1 bg-pink-50 p-4 rounded-xl cursor-pointer hover:bg-pink-100 transition">
                <p class="text-pink-600 text-sm">הוצאות</p>
                <p id="total-expenses" class="font-bold text-xl text-pink-700">0 ₪</p>
            </div>

            <div onclick="toggleSection('income')"
                 class="flex-1 bg-green-50 p-4 rounded-xl cursor-pointer hover:bg-green-100 transition">
                <p class="text-green-600 text-sm">הכנסות</p>
                <p id="total-income" class="font-bold text-xl text-green-700">0 ₪</p>
            </div>
        </div>
    </div>

    <!-- פירוט -->
    <div id="details-section" class="bg-white p-6 rounded-2xl shadow-sm" style="display:none;">
        <div class="flex justify-between items-center mb-4">
            <h2 id="section-title" class="text-lg font-bold text-gray-800">פירוט</h2>
            <button onclick="hideSection()" class="text-gray-400 hover:text-gray-600 font-bold">
                סגור X
            </button>
        </div>

        <ul id="details-list"
            class="space-y-3 text-sm divide-y divide-gray-100 max-h-96 overflow-y-auto"></ul>
    </div>

    <!-- תרשים -->
    <div class="bg-white p-6 rounded-2xl shadow-sm">
        <h2 class="text-center font-bold text-gray-700 mb-4">התפלגות הוצאות</h2>

        <div class="relative w-56 h-56 mx-auto">
            <canvas id="expenseChart"></canvas>
        </div>

        <p id="chart-empty" class="text-center text-gray-400 text-sm mt-3 hidden">
            אין עדיין הוצאות להצגה
        </p>
    </div>

    <!-- הוספת תנועה -->
    <div class="bg-white p-6 rounded-2xl shadow-sm">
        <h2 class="font-bold text-gray-800 mb-4">הוספת תנועה חדשה</h2>

        <div class="flex gap-2 mb-4">
            <button type="button" id="type-expense"
                    onclick="setFormType('expense')"
                    class="flex-1 py-2 rounded-xl font-bold bg-pink-500 text-white transition">
                הוצאה
            </button>

            <button type="button" id="type-income"
                    onclick="setFormType('income')"
                    class="flex-1 py-2 rounded-xl font-bold bg-gray-100 text-gray-600 transition">
                הכנסה
            </button>
        </div>

        <form id="transaction-form" class="space-y-3">

            <div>
                <label class="block text-xs text-gray-500 mb-1">תיאור</label>
                <input type="text" id="tx-desc" placeholder="לדוגמה: סופרמרקט"
                       required
                       class="w-full border border-gray-200 rounded-xl p-2.5 text-sm outline-none focus:border-blue-500">
            </div>

            <div class="flex gap-2">
                <div class="flex-1">
                    <label class="block text-xs text-gray-500 mb-1">תאריך</label>
                    <input type="date" id="tx-date" required
                           class="w-full border border-gray-200 rounded-xl p-2.5 text-sm outline-none focus:border-blue-500">
                </div>

                <div class="flex-1">
                    <label class="block text-xs text-gray-500 mb-1">סכום (₪)</label>
                    <input type="number" id="tx-amount" placeholder="0"
                           min="0.01" step="0.01" required
                           class="w-full border border-gray-200 rounded-xl p-2.5 text-sm outline-none focus:border-blue-500">
                </div>
            </div>

            <div>
                <label class="block text-xs text-gray-500 mb-1">קטגוריה</label>
                <select id="tx-category"
                        onchange="handleCategoryChange()"
                        class="w-full border border-gray-200 rounded-xl p-2.5 text-sm outline-none focus:border-blue-500 bg-white">
                    <option value="דיור">דיור</option>
                    <option value="רכב ודלק">רכב ודלק</option>
                    <option value="ביטוחים">ביטוחים</option>
                    <option value="ילדים וחינוך">ילדים וחינוך</option>
                    <option value="צדקה">צדקה</option>
                    <option value="מזון">מזון</option>
                    <option value="בילויים">בילויים</option>
                    <option value="הכנסות עבודה">הכנסות עבודה</option>
                    <option value="אחר">אחר</option>
                </select>
            </div>

            <div id="custom-category-wrapper" style="display:none;">
                <label class="block text-xs text-gray-500 mb-1">שם קטגוריה ידני</label>
                <input type="text" id="tx-custom-category"
                       placeholder="הקלד שם קטגוריה חדש"
                       class="w-full border border-gray-200 rounded-xl p-2.5 text-sm outline-none focus:border-blue-500">
            </div>

            <button type="submit"
                    class="w-full bg-gray-900 text-white py-3 rounded-xl font-bold text-sm hover:bg-gray-800 transition">
                הוסף תנועה
            </button>
        </form>
    </div>

    <!-- עריכה -->
    <div id="edit-modal"
         class="fixed inset-0 bg-black bg-opacity-50 items-center justify-center p-4"
         style="display:none;">

        <div class="bg-white p-6 rounded-2xl w-full max-w-sm space-y-4">

            <h2 class="font-bold text-lg text-gray-800">עריכת פריט</h2>

            <input type="hidden" id="edit-id">
            <input type="hidden" id="edit-type">

            <div>
                <label class="block text-xs text-gray-500 mb-1">שם הפריט</label>
                <input type="text" id="edit-name"
                       class="w-full border border-gray-200 rounded-xl p-2.5 text-sm outline-none">
            </div>

            <div class="flex gap-2">
                <div class="flex-1">
                    <label class="block text-xs text-gray-500 mb-1">תאריך</label>
                    <input type="date" id="edit-date"
                           class="w-full border border-gray-200 rounded-xl p-2.5 text-sm outline-none">
                </div>

                <div class="flex-1">
                    <label class="block text-xs text-gray-500 mb-1">סכום (₪)</label>
                    <input type="number" id="edit-amount"
                           min="0.01" step="0.01"
                           class="w-full border border-gray-200 rounded-xl p-2.5 text-sm outline-none">
                </div>
            </div>

            <div class="flex gap-2 pt-2">
                <button onclick="saveEdit()"
                        class="flex-1 bg-green-600 text-white py-2.5 rounded-xl font-bold text-sm">
                    שמור
                </button>

                <button onclick="closeEditModal()"
                        class="flex-1 bg-gray-200 text-gray-700 py-2.5 rounded-xl font-bold text-sm">
                    ביטול
                </button>
            </div>
        </div>
    </div>

</div>

<script type="module">

    // =========================================================
    // FIREBASE
    // =========================================================

    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

    import {
        getFirestore,
        collection,
        addDoc,
        updateDoc,
        deleteDoc,
        doc,
        setDoc,
        onSnapshot,
        Timestamp
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDL-TvU-NDdt_mIR0R0nG85IeA2q7tHID0",
        authDomain: "mi-budget-5dd37.firebaseapp.com",
        projectId: "mi-budget-5dd37",
        storageBucket: "mi-budget-5dd37.firebasestorage.app",
        messagingSenderId: "740618672548",
        appId: "1:740618672548:web:3d5c91490d0e9525c00931",
        measurementId: "G-JH6GCNNFRW"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // הקולקציה שכבר קיימת אצלך ב-Firestore
    const transactionsRef = collection(db, "transactions");

    let currentFormType = "expense";
    let transactions = [];
    let activeSectionType = null;
    let expenseChart = null;

    // ההוצאות הקבועות מהקוד הישן שלך.
    // הן נשמרות ב-Firestore עם מזהים קבועים, כך שלא נוצרות כפילויות.
    const FIXED_EXPENSES = [
        ["שכ\"ד/משכנתא", 6353, "דיור"],
        ["חשמל", 120, "דיור"],
        ["גז", 50, "דיור"],
        ["תשלומי רכב", 760, "רכב ודלק"],
        ["הוצאות רכב בליי", 250, "רכב ודלק"],
        ["הלוואות מזרחי דירה", 600, "דיור"],
        ["צדקה אהבת חסד", 100, "צדקה"],
        ["צדקה בית כנסת", 150, "צדקה"],
        ["ביטוח רכב", 350, "ביטוחים"],
        ["ביטוחים", 300, "ביטוחים"],
        ["ועד בית", 245, "דיור"],
        ["חוג לפערי", 180, "ילדים וחינוך"],
        ["טלפון ותקשורת", 180, "אחר"],
        ["דלק", 1000, "רכב ודלק"],
        ["ארמונה בהנחה", 200, "אחר"],
        ["מים", 150, "דיור"],
        ["גן", 1500, "ילדים וחינוך"],
        ["חסכונות ילדים", 600, "ילדים וחינוך"],
        ["הנהלת חשבונות", 180, "אחר"]
    ];

    // ההכנסות הקבועות מהקוד הישן שלך.
    const FIXED_INCOMES = [
        ["משכורת צבא", 8300, "הכנסות עבודה"],
        ["עצמאי", 2000, "הכנסות עבודה"],
        ["משכורת גולדי", 5000, "הכנסות עבודה"],
        ["בונוס ניהול חנות", 1500, "הכנסות עבודה"],
        ["ביטוח לאומי", 276, "הכנסות עבודה"]
    ];

    // =========================================================
    // עזר
    // =========================================================

    function getTodayISO() {
        const now = new Date();
        const offset = now.getTimezoneOffset();
        return new Date(now.getTime() - offset * 60000)
            .toISOString()
            .slice(0, 10);
    }

    function formatMoney(amount) {
        return Number(amount || 0).toLocaleString("he-IL", {
            minimumFractionDigits: 0,
            maximumFractionDigits: 2
        }) + " ₪";
    }

    function formatDate(value) {
        if (!value) return "ללא תאריך";

        let date;

        if (value instanceof Date) {
            date = value;
        } else if (value?.toDate) {
            date = value.toDate();
        } else if (typeof value === "string") {
            // YYYY-MM-DD
            if (/^\d{4}-\d{2}-\d{2}$/.test(value)) {
                const [y, m, d] = value.split("-").map(Number);
                return `${String(d).padStart(2,"0")}/${String(m).padStart(2,"0")}/${y}`;
            }
            date = new Date(value);
        }

        if (!date || isNaN(date.getTime())) return "ללא תאריך";

        return date.toLocaleDateString("he-IL");
    }

    function dateToTimestamp(dateString) {
        const [year, month, day] = dateString.split("-").map(Number);
        return Timestamp.fromDate(new Date(year, month - 1, day, 12, 0, 0));
    }

    function dateValueToInput(value) {
        if (!value) return getTodayISO();

        if (typeof value === "string" &&
            /^\d{4}-\d{2}-\d{2}$/.test(value)) {
            return value;
        }

        const d = value?.toDate ? value.toDate() : new Date(value);

        if (isNaN(d.getTime())) return getTodayISO();

        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");

        return `${year}-${month}-${day}`;
    }

    function categoryFromTransaction(item) {
        if (item.category) return item.category;

        // תמיכה בנתונים הישנים שלך שבהם הקטגוריה הייתה בתוך desc
        const match = String(item.desc || item.name || "")
            .match(/\(([^()]*)\)$/);

        return match ? match[1] : "אחר";
    }

    function descriptionFromTransaction(item) {
        if (item.desc) return item.desc;

        const name = String(item.name || "");
        return name.replace(/\s*\([^()]*\)\s*$/, "");
    }

    function showStatus(message, error = false) {
        const el = document.getElementById("firebase-status");

        el.textContent = message;

        el.className =
            "text-xs text-center rounded-xl p-2 " +
            (error
                ? "bg-red-50 text-red-700"
                : "bg-green-50 text-green-700");
    }

    // =========================================================
    // סוג תנועה
    // =========================================================

    window.setFormType = function(type) {
        currentFormType = type;

        const expenseBtn = document.getElementById("type-expense");
        const incomeBtn = document.getElementById("type-income");

        if (type === "expense") {
            expenseBtn.className =
                "flex-1 py-2 rounded-xl font-bold bg-pink-500 text-white transition";

            incomeBtn.className =
                "flex-1 py-2 rounded-xl font-bold bg-gray-100 text-gray-600 transition";
        } else {
            incomeBtn.className =
                "flex-1 py-2 rounded-xl font-bold bg-green-500 text-white transition";

            expenseBtn.className =
                "flex-1 py-2 rounded-xl font-bold bg-gray-100 text-gray-600 transition";
        }
    };

    window.handleCategoryChange = function() {
        const select = document.getElementById("tx-category");
        const wrapper = document.getElementById("custom-category-wrapper");

        if (select.value === "אחר") {
            wrapper.style.display = "block";
            document.getElementById("tx-custom-category").focus();
        } else {
            wrapper.style.display = "none";
            document.getElementById("tx-custom-category").value = "";
        }
    };

    // =========================================================
    // הוספת ההוצאות הקבועות מהאתר הישן ל-Firestore
    // =========================================================

    async function seedFixedExpenses() {
        const today = getTodayISO();

        for (let i = 0; i < FIXED_EXPENSES.length; i++) {
            const [name, amount, category] = FIXED_EXPENSES[i];

            await setDoc(
                doc(db, "transactions", `fixed_expense_${i + 1}`),
                {
                    name,
                    amount,
                    category,
                    date: dateToTimestamp(today),
                    desc: name,
                    type: "expense",
                    isFixed: true
                },
                { merge: true }
            );
        }
    }

    async function seedFixedIncomes() {
        const today = getTodayISO();

        for (let i = 0; i < FIXED_INCOMES.length; i++) {
            const [name, amount, category] = FIXED_INCOMES[i];

            await setDoc(
                doc(db, "transactions", `fixed_income_${i + 1}`),
                {
                    name,
                    amount,
                    category,
                    date: dateToTimestamp(today),
                    desc: name,
                    type: "income",
                    isFixed: true
                },
                { merge: true }
            );
        }
    }

    // =========================================================
    // טעינת נתונים בזמן אמת
    // =========================================================

    onSnapshot(
        transactionsRef,
        async (snapshot) => {

            transactions = snapshot.docs.map(snapshotDoc => ({
                id: snapshotDoc.id,
                ...snapshotDoc.data()
            }));

            // אם ההוצאות הקבועות מהקוד הישן עדיין לא קיימות,
            // נכניס אותן לענן עם מזהים קבועים.
            if (!transactions.some(item => item.isFixed && item.type === "expense")) {
                try {
                    await seedFixedExpenses();
                } catch (error) {
                    console.error("Fixed expenses seed error:", error);
                    showStatus("לא הצלחתי להוסיף את ההוצאות הקבועות ל-Firebase.", true);
                }
            }

            if (!transactions.some(item => item.isFixed && item.type === "income")) {
                try {
                    await seedFixedIncomes();
                } catch (error) {
                    console.error("Fixed incomes seed error:", error);
                    showStatus("לא הצלחתי להוסיף את ההכנסות הקבועות ל-Firebase.", true);
                }
            }

            // החדשים ביותר למעלה
            transactions.sort((a, b) => {
                const da = a.date?.toDate
                    ? a.date.toDate().getTime()
                    : new Date(a.date || 0).getTime();

                const dbb = b.date?.toDate
                    ? b.date.toDate().getTime()
                    : new Date(b.date || 0).getTime();

                return dbb - da;
            });

            updateUI();
            showStatus("מחובר ל-Firebase ✓");
        },
        (error) => {
            console.error("Firebase error:", error);
            showStatus(
                "שגיאה בחיבור ל-Firebase — בדוק את Rules",
                true
            );
        }
    );

    // =========================================================
    // הוספת תנועה
    // =========================================================

    document.getElementById("transaction-form")
        .addEventListener("submit", async (event) => {

            event.preventDefault();

            const desc =
                document.getElementById("tx-desc").value.trim();

            const amount =
                Number(document.getElementById("tx-amount").value);

            const date =
                document.getElementById("tx-date").value;

            let category =
                document.getElementById("tx-category").value;

            if (!desc) {
                alert("נא להזין תיאור.");
                return;
            }

            if (!Number.isFinite(amount) || amount <= 0) {
                alert("נא להזין סכום תקין.");
                return;
            }

            if (!date) {
                alert("נא לבחור תאריך.");
                return;
            }

            if (category === "אחר") {
                const customCategory =
                    document.getElementById("tx-custom-category")
                        .value.trim();

                if (!customCategory) {
                    alert("נא להזין שם לקטגוריה.");
                    return;
                }

                category = customCategory;
            }

            try {

                await addDoc(transactionsRef, {
                    amount: amount,
                    category: category,
                    date: dateToTimestamp(date),
                    desc: desc,
                    type: currentFormType,
                    isFixed: false
                });

                document.getElementById("tx-desc").value = "";
                document.getElementById("tx-amount").value = "";
                document.getElementById("tx-date").value = getTodayISO();
                document.getElementById("tx-category").value = "דיור";
                document.getElementById("tx-custom-category").value = "";
                document.getElementById("custom-category-wrapper")
                    .style.display = "none";

                showStatus("התנועה נשמרה ב-Firebase ✓");

            } catch (error) {

                console.error("Add transaction error:", error);

                alert(
                    "לא הצלחתי לשמור את התנועה.\n\n" +
                    "בדוק את Firestore Rules."
                );
            }
        });

    // =========================================================
    // תצוגת פירוט
    // =========================================================

    window.toggleSection = function(type, keepOpen = false) {

        const section =
            document.getElementById("details-section");

        if (!keepOpen &&
            activeSectionType === type &&
            section.style.display === "block") {

            hideSection();
            return;
        }

        activeSectionType = type;

        const list =
            document.getElementById("details-list");

        const title =
            document.getElementById("section-title");

        const items =
            transactions.filter(item =>
                item.type === (type === "expenses" ? "expense" : "income")
            );

        title.textContent =
            type === "expenses"
                ? "פירוט הוצאות"
                : "פירוט הכנסות";

        list.innerHTML = "";

        if (items.length === 0) {

            list.innerHTML =
                '<li class="text-center text-gray-400 py-5">אין נתונים להצגה</li>';

        } else {

            items.forEach(item => {

                const li = document.createElement("li");

                li.className =
                    "flex justify-between items-center py-3 gap-2";

                const info = document.createElement("div");
                info.className = "min-w-0";

                const name = document.createElement("div");
                name.className =
                    "text-gray-700 font-medium break-words";

                name.textContent =
                    descriptionFromTransaction(item);

                const meta = document.createElement("div");
                meta.className =
                    "text-xs text-gray-400 mt-1";

                meta.textContent =
                    `${formatDate(item.date)} • ${categoryFromTransaction(item)}`;

                info.appendChild(name);
                info.appendChild(meta);

                const actions =
                    document.createElement("div");

                actions.className =
                    "flex items-center gap-1 shrink-0";

                const amount =
                    document.createElement("span");

                amount.className =
                    "font-semibold " +
                    (item.type === "expense"
                        ? "text-pink-600"
                        : "text-green-600");

                amount.textContent =
                    formatMoney(item.amount ?? item.rawAmount);

                const edit =
                    document.createElement("button");

                edit.className =
                    "text-blue-500 bg-blue-50 px-2 py-1 rounded text-xs font-bold";

                edit.textContent = "ערוך";

                edit.onclick = () =>
                    openEditModal(item.id);

                const del =
                    document.createElement("button");

                del.className =
                    "text-red-500 bg-red-50 px-2 py-1 rounded text-xs font-bold";

                del.textContent = "מחק";

                if (item.isFixed) {
                    const fixedBadge = document.createElement("span");
                    fixedBadge.className =
                        "text-xs text-purple-500 bg-purple-50 px-2 py-1 rounded";
                    fixedBadge.textContent = "קבועה";
                    actions.appendChild(fixedBadge);
                } else {
                    del.onclick = () =>
                        deleteTransaction(item.id);
                }

                actions.appendChild(amount);
                actions.appendChild(edit);
                actions.appendChild(del);

                li.appendChild(info);
                li.appendChild(actions);

                list.appendChild(li);
            });
        }

        section.style.display = "block";
    };

    window.hideSection = function() {
        document.getElementById("details-section")
            .style.display = "none";

        activeSectionType = null;
    };

    // =========================================================
    // מחיקה
    // =========================================================

    window.deleteTransaction = async function(id) {

        const item =
            transactions.find(t => t.id === id);

        if (!item) return;

        const confirmed = confirm(
            `למחוק את "${descriptionFromTransaction(item)}" בסך ${formatMoney(item.amount ?? item.rawAmount)}?`
        );

        if (!confirmed) return;

        try {

            await deleteDoc(
                doc(db, "transactions", id)
            );

            showStatus("התנועה נמחקה ✓");

        } catch (error) {

            console.error(error);

            alert(
                "לא הצלחתי למחוק את התנועה.\n\n" +
                "בדוק את Firestore Rules."
            );
        }
    };

    // =========================================================
    // עריכה
    // =========================================================

    window.openEditModal = function(id) {

        const item =
            transactions.find(t => t.id === id);

        if (!item) return;

        document.getElementById("edit-id").value = id;
        document.getElementById("edit-type").value = item.type || "expense";

        document.getElementById("edit-name").value =
            descriptionFromTransaction(item);

        document.getElementById("edit-amount").value =
            item.amount ?? item.rawAmount ?? 0;

        document.getElementById("edit-date").value =
            dateValueToInput(item.date);

        document.getElementById("edit-modal")
            .style.display = "flex";
    };

    window.closeEditModal = function() {
        document.getElementById("edit-modal")
            .style.display = "none";
    };

    window.saveEdit = async function() {

        const id =
            document.getElementById("edit-id").value;

        const name =
            document.getElementById("edit-name").value.trim();

        const amount =
            Number(document.getElementById("edit-amount").value);

        const date =
            document.getElementById("edit-date").value;

        if (!name) {
            alert("נא להזין שם.");
            return;
        }

        if (!Number.isFinite(amount) || amount <= 0) {
            alert("נא להזין סכום תקין.");
            return;
        }

        if (!date) {
            alert("נא לבחור תאריך.");
            return;
        }

        try {

            await updateDoc(
                doc(db, "transactions", id),
                {
                    desc: name,
                    amount: amount,
                    date: dateToTimestamp(date)
                }
            );

            closeEditModal();

            showStatus("התנועה עודכנה ✓");

        } catch (error) {

            console.error(error);

            alert(
                "לא הצלחתי לעדכן את התנועה.\n\n" +
                "בדוק את Firestore Rules."
            );
        }
    };

    // =========================================================
    // UI
    // =========================================================

    function updateUI() {

        const expenses =
            transactions.filter(t => t.type === "expense");

        const income =
            transactions.filter(t => t.type === "income");

        const totalExpenses =
            expenses.reduce(
                (sum, t) => sum + Number(t.amount ?? t.rawAmount ?? 0),
                0
            );

        const totalIncome =
            income.reduce(
                (sum, t) => sum + Number(t.amount ?? t.rawAmount ?? 0),
                0
            );

        const balance =
            totalIncome - totalExpenses;

        document.getElementById("total-expenses")
            .textContent = formatMoney(totalExpenses);

        document.getElementById("total-income")
            .textContent = formatMoney(totalIncome);

        const balanceElement =
            document.getElementById("net-balance");

        balanceElement.textContent =
            (balance >= 0 ? "+" : "") + formatMoney(balance);

        balanceElement.className =
            "text-3xl font-bold mb-4 " +
            (balance >= 0
                ? "text-green-600"
                : "text-pink-600");

        updateChart();

        if (activeSectionType) {
            toggleSection(activeSectionType, true);
        }
    }

    // =========================================================
    // גרף
    // =========================================================

    function updateChart() {

        const totals = {};

        transactions
            .filter(t => t.type === "expense")
            .forEach(item => {

                const category =
                    categoryFromTransaction(item);

                totals[category] =
                    (totals[category] || 0) +
                    Number(item.amount ?? item.rawAmount ?? 0);
            });

        const labels =
            Object.keys(totals);

        const values =
            Object.values(totals);

        const empty =
            document.getElementById("chart-empty");

        if (expenseChart) {
            expenseChart.destroy();
            expenseChart = null;
        }

        if (!labels.length) {
            empty.classList.remove("hidden");
            return;
        }

        empty.classList.add("hidden");

        const ctx =
            document.getElementById("expenseChart")
                .getContext("2d");

        expenseChart = new Chart(ctx, {

            type: "doughnut",

            data: {
                labels: labels,

                datasets: [{
                    data: values,

                    backgroundColor: [
                        "#f43f5e",
                        "#fb7185",
                        "#f59e0b",
                        "#22c55e",
                        "#3b82f6",
                        "#8b5cf6",
                        "#06b6d4",
                        "#64748b",
                        "#ec4899",
                        "#14b8a6"
                    ],

                    borderWidth: 1
                }]
            },

            options: {
                responsive: true,
                maintainAspectRatio: false,

                plugins: {
                    legend: {
                        position: "bottom"
                    },

                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                return " " +
                                    context.label +
                                    ": " +
                                    formatMoney(context.raw);
                            }
                        }
                    }
                }
            }
        });
    }

    // סגירת עריכה בלחיצה מחוץ לחלון
    document.getElementById("edit-modal")
        .addEventListener("click", function(event) {

            if (event.target === this) {
                closeEditModal();
            }
        });

    // ברירת מחדל לתאריך
    document.getElementById("tx-date").value =
        getTodayISO();

</script>

</body>
</html>
